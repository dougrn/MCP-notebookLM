[project]
name = "mcp-notebooklm"
version = "0.1.0"
description = "Servidor MCP em Python com FastMCP para conexão com Google NotebookLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==4.1.0",
    "mcp==2.3.0",
    "notebooklm-py[headless]==0.8.5",
    "playwright==1.64.0",
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
    "rich==15.0.0",
    "gpsoauth==2.0.0",
]

[project.scripts]
mcp-notebooklm = "server:main"
mcp-notebooklm-login = "login:main"
